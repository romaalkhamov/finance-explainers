<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compound Interest & Inflation — Finance Explainers</title>
<link rel="stylesheet" href="../../assets/style.css">
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <a class="back" href="../../index.html" data-i18n="back">← Все темы</a>
    <div class="controls">
      <button class="iconbtn" id="lang-toggle">EN</button>
      <button class="iconbtn" id="theme-toggle">🌙</button>
    </div>
  </div>

  <div class="topic-head">
    <h1 data-i18n="title">Сложный процент и инфляция</h1>
    <p data-i18n="intro">Двигай слайдеры: смотри, как растёт сумма номинально — и сколько из этого роста «съедает» инфляция в реальной покупательной способности.</p>
  </div>

  <div class="panel">
    <div class="controls-card">

      <div class="field">
        <label><span data-i18n="f_principal">Стартовая сумма</span><span class="val" id="v-principal">$10,000</span></label>
        <input type="range" id="principal" min="1000" max="100000" step="1000" value="10000">
      </div>

      <div class="field">
        <label><span data-i18n="f_rate">Годовая доходность</span><span class="val" id="v-rate">7%</span></label>
        <input type="range" id="rate" min="0" max="20" step="0.5" value="7">
      </div>

      <div class="field">
        <label><span data-i18n="f_years">Срок, лет</span><span class="val" id="v-years">30</span></label>
        <input type="range" id="years" min="1" max="50" step="1" value="30">
      </div>

      <div class="field">
        <label><span data-i18n="f_inflation">Инфляция в год</span><span class="val" id="v-inflation">3%</span></label>
        <input type="range" id="inflation" min="0" max="15" step="0.5" value="3">
      </div>

      <div class="field">
        <label><span data-i18n="f_compound">Начисление процента</span></label>
        <div class="seg" id="compound-seg">
          <button data-n="1" class="active" data-i18n="f_c_annual">раз в год</button>
          <button data-n="12" data-i18n="f_c_monthly">ежемесячно</button>
          <button data-n="365" data-i18n="f_c_daily">ежедневно</button>
        </div>
      </div>

    </div>

    <div class="chart-card">
      <div class="legend">
        <span class="item"><span class="dot" style="background:var(--series-1)"></span><span data-i18n="leg_nominal">Номинальная сумма</span></span>
        <span class="item"><span class="dot" style="background:var(--series-2)"></span><span data-i18n="leg_real">Реальная (с учётом инфляции)</span></span>
      </div>
      <div class="chart-wrap">
        <svg class="chart-svg" id="chart" viewBox="0 0 760 360" preserveAspectRatio="xMidYMid meet"></svg>
        <div class="tooltip" id="tooltip"></div>
      </div>
      <div class="insight" id="insight-text"></div>
    </div>
  </div>

</div>

<script>
window.I18N = {
  ru: {
    back: "← Все темы",
    title: "Сложный процент и инфляция",
    intro: "Двигай слайдеры: смотри, как растёт сумма номинально — и сколько из этого роста «съедает» инфляция в реальной покупательной способности.",
    f_principal: "Стартовая сумма", f_rate: "Годовая доходность", f_years: "Срок, лет",
    f_inflation: "Инфляция в год", f_compound: "Начисление процента",
    f_c_annual: "раз в год", f_c_monthly: "ежемесячно", f_c_daily: "ежедневно",
    leg_nominal: "Номинальная сумма", leg_real: "Реальная (с учётом инфляции)",
    tt_year: "Год", tt_nominal: "Номинал", tt_real: "Реально",
    end_nominal: "Номинал", end_real: "Реально"
  },
  en: {
    back: "← All topics",
    title: "Compound Interest & Inflation",
    intro: "Drag the sliders: watch the nominal amount grow — and see how much of that growth inflation quietly eats in real purchasing power.",
    f_principal: "Starting amount", f_rate: "Annual return", f_years: "Years",
    f_inflation: "Annual inflation", f_compound: "Compounding",
    f_c_annual: "annually", f_c_monthly: "monthly", f_c_daily: "daily",
    leg_nominal: "Nominal amount", leg_real: "Real (inflation-adjusted)",
    tt_year: "Year", tt_nominal: "Nominal", tt_real: "Real",
    end_nominal: "Nominal", end_real: "Real"
  }
};
</script>
<script src="../../assets/common.js"></script>
<script src="script.js"></script>
</body>
</html>
